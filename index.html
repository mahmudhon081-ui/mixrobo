<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mixRobot OS v2.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: radial-gradient(circle at center, #0f1020 0%, #05050a 100%); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            color: #fff;
        }

        /* Экран авторизации */
        #auth-screen {
            position: absolute;
            width: 380px;
            background: rgba(15, 17, 35, 0.85);
            border: 2px solid rgba(0, 242, 254, 0.4);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.2);
            backdrop-filter: blur(20px);
            text-align: center;
            z-index: 10;
            transition: 0.5s ease;
        }
        #auth-screen h2 { margin-bottom: 10px; color: #00f2fe; font-size: 22px; }
        #auth-screen p { font-size: 13px; color: #a0a0c0; margin-bottom: 20px; }
        #auth-screen input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 15px;
            outline: none;
        }
        #auth-screen button {
            width: 100%;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 10px;
            padding: 12px;
            color: #000;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        #auth-screen button:hover { transform: scale(1.02); box-shadow: 0 0 20px #00f2fe; }
        .error-text { color: #ff4757; font-size: 12px; margin-top: 10px; display: none; }

        /* Основной контейнер чата */
        .chat-card {
            width: 550px;
            height: 700px;
            background: rgba(13, 15, 30, 0.75);
            border-radius: 20px;
            backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 242, 254, 0.05);
            display: none;
            flex-direction: column;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
        }

        .title-info h2 { color: #fff; font-size: 18px; letter-spacing: 0.5px; }
        .title-info span { color: #00f2fe; font-size: 11px; display: flex; align-items: center; gap: 5px; }
        .title-info span::before { content: ''; width: 6px; height: 6px; background: #00f2fe; border-radius: 50%; box-shadow: 0 0 8px #00f2fe; display: inline-block; }

        .logout-btn {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.4);
            color: #ff4757;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .logout-btn:hover { background: rgba(255, 71, 87, 0.4); box-shadow: 0 0 10px rgba(255, 71, 87, 0.4); }

        #chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 15px 5px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #chat-body::-webkit-scrollbar { width: 5px; }
        #chat-body::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.3); border-radius: 5px; }

        .msg {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in-out;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            border-bottom-right-radius: 3px;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.3);
        }

        .bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.07);
            color: #e0e0e0;
            border-bottom-left-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .input-box {
            display: flex;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            padding: 14px 18px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input[type="text"]:focus { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }

        .send-btn {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 12px;
            padding: 0 22px;
            color: #05050a;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
        }

        .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px #00f2fe; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Экран авторизации -->
    <div id="auth-screen">
        <h2>🔒 mixRobot Secure</h2>
        <p>Введите персональный ПИН-код инженера</p>
        <input type="password" id="pinInput" placeholder="••••" maxlength="6" onkeydown="if(event.key === 'Enter') checkPin()">
        <button onclick="checkPin()">Разблокировать систему</button>
        <div id="errorText" class="error-text">Неверный ПИН-код! Доступ запрещен.</div>
    </div>

    <!-- Интерфейс чата -->
    <div class="chat-card" id="chatCard">
        <div class="header">
            <div class="user-info">
                <div class="avatar">🤖</div>
                <div class="title-info">
                    <h2>mixRobot AI Core</h2>
                    <span>Защищенный узел • Махмудхон</span>
                </div>
            </div>
            <button class="logout-btn" onclick="lockSystem()">Выход</button>
        </div>

        <div id="chat-body">
            <div class="msg bot">Системы безопасности активированы. Доступ разрешен, Махмудхон! Чем зайдемся сегодня?</div>
        </div>

        <div class="input-box">
            <input type="text" id="userInput" placeholder="Спроси у mixRobot..." onkeydown="if(event.key === 'Enter') send()">
            <button class="send-btn" onclick="send()">➤</button>
        </div>
    </div>

<script>
    // ⚙️ НАСТРОЙКИ БЕЗОПАСНОСТИ И КЛЮЧ
    const CORRECT_PIN = "2026"; // Можешь поменять пин-код здесь
    const API_KEY = "AQ.Ab8RN6KGNmFj7Ni0Z2UaXp_icp0y-frPH6R7LmYoQjWvip6kUw"; // Твой ключ от Google AI Studio

    function checkPin() {
        let enteredPin = document.getElementById("pinInput").value;
        let errorText = document.getElementById("errorText");

        if (enteredPin === CORRECT_PIN) {
            document.getElementById("auth-screen").style.display = "none";
            document.getElementById("chatCard").style.display = "flex";
            document.getElementById("userInput").focus();
        } else {
            errorText.style.display = "block";
            document.getElementById("pinInput").value = "";
        }
    }

    function lockSystem() {
        document.getElementById("chatCard").style.display = "none";
        document.getElementById("auth-screen").style.display = "block";
        document.getElementById("pinInput").value = "";
        document.getElementById("errorText").style.display = "none";
    }

    async function send() {
        let input = document.getElementById("userInput");
        let text = input.value.trim();
        if (!text) return;

        let body = document.getElementById("chat-body");

        // Вывод сообщения пользователя
        body.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
        input.value = "";
        body.scrollTop = body.scrollHeight;

        // Индикатор загрузки
        let thinkingId = "think-" + Date.now();
        body.innerHTML += `<div class="msg bot" id="${thinkingId}"><i>Идет обработка нейро-сигналов... ⚡</i></div>`;
        body.scrollTop = body.scrollHeight;

        try {
            let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: "Ты — mixRobot, футуристичный ИИ-помощник и будущий гуманоидный робот, созданный инженером Махмудхоном. Отвечай технологично, дерзко, но дружелюбно. Помогай с микроконтроллерами, C++, платами и инженерией. Запрос: " + text
                        }]
                    }]
                })
            });

            let data = await response.json();
            let reply = data.candidates[0].content.parts[0].text;

            document.getElementById(thinkingId).innerText = reply;
        } catch (error) {
            document.getElementById(thinkingId).innerText = "❌ Ошибка безопасности или сети! Проверь правильность API ключа.";
        }

        body.scrollTop = body.scrollHeight;
    }

    // Защита от взлома через текст (экранирование)
    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
